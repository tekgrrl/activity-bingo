<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Bonanza! - Table Stakes Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bingo-cell {
            display: flex; align-items: center; justify-content: center; text-align: center;
            word-break: break-word; hyphens: auto; padding: 0.5rem;
            aspect-ratio: 1 / 1; overflow: hidden;
        }
        .bingo-cell.marked { background-color: #4ade80; color: white; }
        .bingo-cell.marked button { color: white; }
        .bingo-cell.table-stakes-cell { background-color: #e0e7ff; }
        .bingo-cell.table-stakes-cell.marked { background-color: #6366f1; }
        .bingo-cell.deferred { background-color: #f3f4f6 !important; }
        .bingo-cell.deferred button { color: #9ca3af !important; }
        .bingo-cell button {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border-radius: inherit; line-height: 1.2;
        }
        .bingo-cell button:disabled { cursor: not-allowed; opacity: 0.7; }
        .bingo-line {
            background-color: #fbbf24 !important;
            color: #000 !important;
            animation: pulse 1s infinite alternate;
        }
        .bingo-line button { color: #000 !important; }
        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 5px #fbbf24; }
            to { transform: scale(1.05); box-shadow: 0 0 15px #fbbf24, 0 0 25px #fbbf24; }
        }
        .time-block-cell { background-color: #fef3c7; }
        .time-block-cell button { color: #92400e; font-style: italic; }
        .time-block-cell.marked button { color: white; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-2xl relative">
        <header class="text-center mb-6">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-700">Bingo Bonanza!</h1>
        </header>

        <div id="bingo-card" class="grid grid-cols-5 gap-1 sm:gap-2 mb-6 bg-gray-200 p-1 sm:p-2 rounded-lg min-h-[300px] sm:min-h-[400px]">
        </div>

        <div id="message-area" class="text-center font-medium h-12 mb-4 flex items-center justify-center"></div>

        <button id="new-board-btn" class="w-full bg-gradient-to-r from-pink-500 to-orange-500 hover:from-pink-600 hover:to-orange-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-opacity-50 mb-3">
            Generate New Board
        </button>
        <button id="manage-activities-btn" class="w-full bg-white border-2 border-indigo-400 hover:border-indigo-600 text-indigo-600 hover:text-indigo-800 font-semibold py-2 px-6 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            Manage Activities
        </button>
    </div>

    <footer class="mt-8 text-center text-sm text-white/80">
        <p>Click a square to mark it. Get 5 in a row to win!</p>
        <p id="save-status" class="text-xs mt-1"></p>
    </footer>

    <!-- Confirm Modal -->
    <div id="confirmation-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 p-4">
        <div id="confirm-modal-content" class="absolute bg-white p-6 rounded-lg shadow-xl w-full max-w-xs text-center">
            <p id="modal-message" class="text-base mb-5 text-gray-700">Are you sure?</p>
            <div class="flex flex-col gap-2">
                <button id="modal-confirm-btn" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-lg transition-colors duration-150">Mark Done</button>
                <button id="modal-defer-btn" class="hidden bg-amber-100 hover:bg-amber-200 text-amber-700 font-semibold py-2 px-6 rounded-lg transition-colors duration-150">Defer for Today</button>
                <button id="modal-cancel-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-600 font-semibold py-2 px-6 rounded-lg transition-colors duration-150">Cancel</button>
            </div>
        </div>
    </div>

    <!-- TABLE STAKES Modal -->
    <div id="table-stakes-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6">
            <h2 class="text-2xl font-bold text-indigo-700 mb-1">TABLE STAKES</h2>
            <p class="text-sm text-gray-500 mb-4">The non-negotiables. Do these every day.</p>
            <ul id="table-stakes-list" class="space-y-3 mb-6"></ul>
            <div class="flex gap-3">
                <button id="ts-mark-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition-colors duration-150"></button>
                <button id="ts-close-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-lg transition-colors duration-150">Close</button>
            </div>
        </div>
    </div>

    <!-- New Day Summary Modal -->
    <div id="new-day-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[90vh] overflow-hidden">
            <div class="p-6 pb-4 bg-gradient-to-r from-blue-600 to-purple-700 rounded-t-xl">
                <h2 class="text-2xl font-bold text-white">New Day!</h2>
                <p id="new-day-subtitle" class="text-blue-100 text-sm mt-1"></p>
            </div>
            <div id="new-day-stats" class="p-4 border-b border-gray-200 grid grid-cols-3 gap-3 text-center"></div>
            <div class="p-4 flex-1 overflow-y-auto">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">Yesterday's Board</h3>
                <div id="previous-board-mini" class="grid grid-cols-5 gap-1"></div>
            </div>
            <div class="p-4 border-t border-gray-200 space-y-2">
                <button id="new-day-generate-btn" class="w-full bg-gradient-to-r from-pink-500 to-orange-500 hover:from-pink-600 hover:to-orange-600 text-white font-semibold py-3 rounded-lg transition-all duration-200">
                    Start Today's Board
                </button>
                <button id="new-day-dismiss-btn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium py-2 rounded-lg transition-colors duration-150 text-sm">
                    Dismiss
                </button>
            </div>
        </div>
    </div>

    <!-- Capacity Warning Modal -->
    <div id="capacity-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6">
            <div class="flex items-center gap-2 mb-3">
                <span class="text-2xl">⚠️</span>
                <h2 class="text-xl font-bold text-orange-600">Not Enough Activities</h2>
            </div>
            <p id="capacity-message" class="text-gray-600 text-sm mb-3"></p>
            <ul id="capacity-suggestions" class="text-sm text-gray-500 space-y-1 mb-5 list-disc list-inside"></ul>
            <div class="flex gap-3">
                <button id="capacity-manage-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg text-sm transition-colors">Manage Activities</button>
                <button id="capacity-close-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-lg text-sm transition-colors">Close</button>
            </div>
        </div>
    </div>

    <!-- Manage Activities Modal -->
    <div id="activities-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[90vh]">
            <div class="p-6 pb-4 border-b border-gray-200">
                <h2 class="text-2xl font-bold text-gray-800">Manage Activities</h2>
                <p class="text-sm text-gray-500 mt-1">Add tasks or adjust how often repeatables appear.</p>
            </div>

            <!-- Add form -->
            <div class="p-6 pb-4 border-b border-gray-200">
                <div class="flex gap-2">
                    <input id="new-activity-input" type="text" placeholder="New activity..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                    <button id="add-activity-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition-colors duration-150">Add</button>
                </div>
                <label class="flex items-center gap-2 mt-2 text-sm text-gray-600 cursor-pointer">
                    <input id="repeatable-checkbox" type="checkbox" class="rounded" />
                    Repeatable (can appear multiple times on a board)
                </label>
                <div id="max-per-day-row" class="hidden mt-2 flex items-center gap-2 text-sm text-gray-600">
                    <label for="max-per-day-select" class="whitespace-nowrap">Max per day:</label>
                    <select id="max-per-day-select" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400">
                        <option value="0">0 — Excluded from pool</option>
                        <option value="1">1 per day</option>
                        <option value="2">2 per day</option>
                        <option value="3">3 per day</option>
                        <option value="Dynamic" selected>Dynamic (system chooses)</option>
                    </select>
                </div>
            </div>

            <!-- Activity list -->
            <div class="flex-1 overflow-y-auto p-6 pt-4">
                <div id="activities-list" class="space-y-2"></div>
            </div>

            <div class="p-4 border-t border-gray-200">
                <button id="activities-close-btn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-lg transition-colors duration-150">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
